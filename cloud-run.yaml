apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: apk-scanner
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle; max 3 instances
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        # Allow multi-container (sidecar) support
        run.googleapis.com/execution-environment: gen2
    spec:
      # Shared in-memory volume for APK uploads between API and Analyzer containers
      volumes:
        - name: uploads
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

      containers:
        # ── Ingress container: Node.js API ──────────────────────────────────
        - name: api
          image: REGION-docker.pkg.dev/PROJECT_ID/apk-scanner/api:latest
          ports:
            - containerPort: 3001
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: apk-scanner-secrets
                  key: MONGODB_URI
            - name: ANALYZER_URL
              value: "http://localhost:5001"
            - name: UPLOADS_DIR
              value: "/app/uploads"
            - name: NODE_ENV
              value: "production"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            limits:
              cpu: "1"
              memory: 512Mi

        # ── Sidecar: Python Analyzer ────────────────────────────────────────
        - name: analyzer
          image: REGION-docker.pkg.dev/PROJECT_ID/apk-scanner/analyzer:latest
          env:
            - name: ANALYZER_PORT
              value: "5001"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
